name: Sync upstream (one-shot)

# 一次性同步工作流：由推送 .github/workflows/sync-oneshot.yml 自触发，
# 用 merge-upstream API 同步上游（上游改了 workflow 文件时 GITHUB_TOKEN 无法直接同步，
# 故先把冲突源对齐后再跑本工作流），随后触发 Auto Deploy 并等待结果。
# 完成后本文件会被删除。

on:
  push:
    paths:
      - ".github/workflows/sync-oneshot.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-oneshot
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository_owner == 'lll33lll'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cancel stale Auto Deploy runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/auto-deploy.yml/runs?per_page=15" --jq '.workflow_runs[] | select(.status != "completed") | .id')
          for id in $ids; do
            echo "Cancelling stale run: ${id}"
            gh run cancel "${id}" --repo "${GITHUB_REPOSITORY}" || true
          done

      - name: Merge upstream into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if resp=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main 2>mu.err); then
            if [[ -s mu.err ]]; then cat mu.err >&2; fi
            echo "${resp}" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("merge_type:", d.get("merge_type"), "| base_branch:", d.get("base_branch"))'
          else
            cat mu.err >&2
            echo "::warning title=merge-upstream 失败::回退 git merge -X theirs"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote add up https://github.com/newbietan/CloudSSH.git
            git fetch --quiet up main
            git merge -X theirs --no-edit up/main
            git push origin main
          fi

      - name: Trigger deploy and wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow auto-deploy.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          echo "before run id: ${before}"
          gh workflow run auto-deploy.yml --repo "${GITHUB_REPOSITORY}" --ref main
          run_id=""
          for i in $(seq 1 36); do
            sleep 10
            newest=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow auto-deploy.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')
            if [ "${newest}" != "${before}" ]; then
              run_id="${newest}"
              break
            fi
          done
          if [ -z "${run_id}" ]; then
            echo "::error::未检测到新触发的 Auto Deploy run"
            exit 1
          fi
          echo "deploy run id: ${run_id}"
          conclusion=""
          for i in $(seq 1 40); do
            sleep 15
            status=$(gh run view "${run_id}" --repo "${GITHUB_REPOSITORY}" --json status --jq '.status')
            if [ "${status}" = "completed" ]; then
              conclusion=$(gh run view "${run_id}" --repo "${GITHUB_REPOSITORY}" --json conclusion --jq '.conclusion')
              break
            fi
          done
          echo "deploy conclusion: ${conclusion:-unknown}"
          {
            echo "## One-shot 同步部署结果"
            echo
            echo "- 上游合并：完成"
            echo "- 部署 run：[${run_id}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id})"
            echo "- 部署结论：${conclusion}"
          } >> "${GITHUB_STEP_SUMMARY}"
          [ "${conclusion}" = "success" ]
