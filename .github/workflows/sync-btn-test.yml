name: Sync button self-test

# 临时自测工作流：验证「Sync upstream」按钮改动后的行为（推送自触发，验证完删除）。
on:
  push:
    paths:
      - ".github/workflows/sync-btn-test.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  test:
    if: github.repository_owner == 'lll33lll'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dispatch sync-upstream and wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow sync-upstream.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          echo "before: ${before}"
          gh workflow run sync-upstream.yml --repo "${GITHUB_REPOSITORY}" --ref main
          rid=""
          for i in $(seq 1 30); do
            sleep 10
            newest=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow sync-upstream.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')
            if [ "${newest}" != "${before}" ]; then
              rid="${newest}"
              break
            fi
          done
          if [ -z "${rid}" ]; then
            echo "::error::未检测到 sync-upstream 新 run"
            exit 1
          fi
          echo "sync run id: ${rid}"
          for i in $(seq 1 30); do
            st=$(gh run view "${rid}" --repo "${GITHUB_REPOSITORY}" --json status --jq '.status')
            if [ "${st}" = "completed" ]; then
              break
            fi
            sleep 10
          done
          concl=$(gh run view "${rid}" --repo "${GITHUB_REPOSITORY}" --json conclusion --jq '.conclusion')
          echo "sync-upstream conclusion: ${concl}"
          {
            echo "## 同步按钮自测结果"
            echo
            echo "- sync-upstream run: [${rid}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${rid})"
            echo "- 结论：${concl}"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${concl}" = "success" ]
