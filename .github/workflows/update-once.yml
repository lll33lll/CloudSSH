name: Update once (deploy upstream main + sync fork)

# 一次性更新用：构建并部署上游 newbietan/CloudSSH 的 main，再把 fork 的 main
# 合并到上游版本（保留 fork 自己的 .github/workflows，绕开 workflows 权限限制）。
# 跑完可删掉本文件。
on:
  push:
    paths:
      - ".github/workflows/update-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-once-cloudssh
  cancel-in-progress: false

jobs:
  deploy-upstream:
    if: github.repository_owner == 'lll33lll'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout upstream main
        uses: actions/checkout@v4
        with:
          repository: newbietan/CloudSSH
          ref: main
          path: upstream
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.8.0"

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: upstream/pnpm-lock.yaml

      - name: Install and build
        working-directory: upstream
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:frontend

      - name: Deploy worker
        working-directory: upstream
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          path: fork
          fetch-depth: 0

      - name: Merge upstream into fork
        working-directory: fork
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/newbietan/CloudSSH.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "fork already contains upstream main"
            exit 0
          fi
          git merge --no-commit --no-ff -X ours upstream/main || true
          git reset -q HEAD -- .github
          git checkout HEAD -- .github
          git clean -fdq .github
          git add -A
          git commit -m "chore: merge upstream main (keep fork .github)" || echo "nothing to commit"
          git push origin HEAD:main
